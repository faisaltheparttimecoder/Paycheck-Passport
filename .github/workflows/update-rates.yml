name: Update Exchange Rates

on:
    schedule:
        # Run daily at 6 AM UTC
        - cron: '0 6 * * *'
    workflow_dispatch: # Allow manual trigger

jobs:
    update-rates:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Fetch latest exchange rates
              run: |
                  # Fetch rates from frankfurter.app (free, no API key required)
                  curl -sf "https://api.frankfurter.dev/v2/rates" > /tmp/rates_raw.json

                  # Transform to our format (add EUR base rate + metadata)
                  node -e "
                    const fs = require('fs');
                    const raw = JSON.parse(fs.readFileSync('/tmp/rates_raw.json', 'utf8'));
                    const output = {
                      base: 'EUR',
                      date: raw.date,
                      rates: { EUR: 1.0, ...raw.rates },
                      source: 'frankfurter.app',
                      note: 'Rates are approximate and updated daily. For informational purposes only.'
                    };
                    console.log(JSON.stringify(output, null, 2));
                  " > data/rates.json

            - name: Check for changes
              id: check
              run: |
                  if git diff --quiet data/rates.json; then
                    echo "changed=false" >> $GITHUB_OUTPUT
                  else
                    echo "changed=true" >> $GITHUB_OUTPUT
                  fi

            - name: Commit and push if changed
              if: steps.check.outputs.changed == 'true'
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add data/rates.json
                  git commit -m "chore: update exchange rates [$(date +%Y-%m-%d)]"
                  git push
